<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <style>
.tv-row { transform-box: fill-box; transform-origin: center; }
.tv-row-top { animation: row-left 6s linear infinite; }
.tv-row-middle { animation: row-right 8.25s linear infinite; }
.tv-row-bottom { animation: row-left 10.5s linear infinite; }
@keyframes row-left { from { transform: translateX(0); } to { transform: translateX(-152px); } }
@keyframes row-right { from { transform: translateX(-153px); } to { transform: translateX(0); } }
@media (prefers-reduced-motion: reduce) { .tv-row { animation: none; } }
</style>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0c0a09" />
      <stop offset="1" stop-color="#1c1917" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="16" fill="url(#bg)" />
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="32" y="80" font-size="40" font-weight="700" letter-spacing="-.5" fill="#fff">Fire TV UI</text>
    <text x="32" y="112" font-size="14" fill="#a8a29e">Your TV. Your home. Your settings.</text>
    <rect x="32" y="132" width="104" height="22" rx="11" fill="#1a1a1a" stroke="#3b82f6" stroke-width=".8" />
    <text x="84.0" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#3b82f6">Custom home</text>
    <rect x="144" y="132" width="104" height="22" rx="11" fill="#1a1a1a" stroke="#8b5cf6" stroke-width=".8" />
    <text x="196.0" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#8b5cf6">Screensavers</text>
    <rect x="256" y="132" width="98" height="22" rx="11" fill="#1a1a1a" stroke="#22c55e" stroke-width=".8" />
    <text x="305.0" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#22c55e">TV backups</text>
    <rect x="362" y="132" width="118" height="22" rx="11" fill="#1a1a1a" stroke="#f59e0b" stroke-width=".8" />
    <text x="421.0" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#f59e0b">Local protection</text>
  </g>
  <g transform="translate(570,35)">
    <rect width="168" height="108" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="3" />
    <defs>
      <clipPath id="row-top">
        <rect x="12" y="14" width="144" height="14" rx="4" />
      </clipPath>
      <clipPath id="row-middle">
        <rect x="12" y="39" width="144" height="26" rx="4" />
      </clipPath>
      <clipPath id="row-bottom">
        <rect x="12" y="75" width="144" height="19" rx="4" />
      </clipPath>
    </defs>
    <g clip-path="url(#row-top)">
      <g class="tv-row tv-row-top">
        <rect x="12" y="14" width="94" height="14" rx="4" fill="#3b82f6" />
        <rect x="114" y="14" width="42" height="14" rx="4" fill="#60a5fa" />
        <rect x="164" y="14" width="94" height="14" rx="4" fill="#3b82f6" />
        <rect x="266" y="14" width="42" height="14" rx="4" fill="#60a5fa" />
      </g>
    </g>
    <g clip-path="url(#row-middle)">
      <g class="tv-row tv-row-middle">
        <rect x="12" y="39" width="43" height="26" rx="4" fill="#8b5cf6" />
        <rect x="63" y="39" width="43" height="26" rx="4" fill="#22c55e" />
        <rect x="114" y="39" width="42" height="26" rx="4" fill="#f59e0b" />
        <rect x="165" y="39" width="43" height="26" rx="4" fill="#8b5cf6" />
        <rect x="216" y="39" width="43" height="26" rx="4" fill="#22c55e" />
        <rect x="267" y="39" width="42" height="26" rx="4" fill="#f59e0b" />
      </g>
    </g>
    <g clip-path="url(#row-bottom)">
      <g class="tv-row tv-row-bottom">
        <rect x="12" y="75" width="94" height="19" rx="4" fill="#334155" />
        <rect x="114" y="75" width="42" height="19" rx="4" fill="#64748b" />
        <rect x="164" y="75" width="94" height="19" rx="4" fill="#334155" />
        <rect x="266" y="75" width="42" height="19" rx="4" fill="#64748b" />
      </g>
    </g>
    <path d="M84 110V127M53 128H115" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
