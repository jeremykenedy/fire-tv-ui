name: Source-native production build and checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build unsigned source-native production candidate
        run: python3 scripts/build.py --unsigned --output-dir "$RUNNER_TEMP/native-production"
      - name: Check production build and manifest contracts
        run: |
          python3 -m unittest discover -s tests/production_release -v
          python3 -m unittest discover -s tests -p test_installer.py -v
          python3 -m unittest discover -s tests -p test_build.py -v
          python3 native/tests/device/production_contract_test.py
          python3 native/tests/device/run.py
      - name: Check whitespace
        run: git diff --check
