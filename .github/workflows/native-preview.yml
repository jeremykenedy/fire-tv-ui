name: Source preview build and host checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the declared Android toolchain
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Expose the SDK path used by existing host harnesses
        shell: bash
        run: |
          mkdir -p "$HOME/Library/Android"
          if [ ! -e "$HOME/Library/Android/sdk" ]; then
            ln -s "$ANDROID_HOME" "$HOME/Library/Android/sdk"
          fi
          test "$(readlink -f "$HOME/Library/Android/sdk")" = "$(readlink -f "$ANDROID_HOME")"
      - name: Build the unsigned source preview
        run: >-
          python3 native/build.py --release-config native/preview-release.json
          --unsigned --output-dir "$RUNNER_TEMP/native-preview"
      - name: Run reviewed source-preview host checks
        run: >-
          python3 native/tests/run_host_checks.py
          --classes-dir "$RUNNER_TEMP/native-preview/.build/classes"
      - name: Check whitespace
        run: git diff --check
